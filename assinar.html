<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assinatura Digital - SD Vidros</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f0f0f;
    color: #eee;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 { font-size: 20px; text-align: center; color: #fbbf24; margin-bottom: 4px; }
  .subtitle { color: #999; font-size: 13px; margin-bottom: 20px; text-align: center; }
  #contrato-texto {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 16px;
    width: 100%;
    max-width: 500px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  label { width: 100%; max-width: 500px; font-size: 14px; margin-bottom: 6px; color: #ccc; }
  input[type="text"] {
    width: 100%;
    max-width: 500px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #eee;
    font-size: 15px;
    margin-bottom: 20px;
  }
  canvas {
    width: 100%;
    max-width: 500px;
    height: 200px;
    background: #fff;
    border-radius: 10px;
    touch-action: none;
    margin-bottom: 12px;
  }
  .canvas-actions {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
  }
  .btn-limpar {
    background: none;
    border: 1px solid #444;
    color: #aaa;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
  }
  .btn-confirmar {
    width: 100%;
    max-width: 500px;
    padding: 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #1a1a1a;
    font-size: 16px;
    font-weight: 700;
  }
  .btn-confirmar:disabled { opacity: 0.5; }
  .msg { text-align: center; margin-top: 16px; font-size: 14px; }
  .msg.erro { color: #f87171; }
  .msg.sucesso { color: #4ade80; }
  .loading, .sucesso-tela { text-align: center; margin-top: 60px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="tela-loading" class="loading">
  <p>Carregando contrato...</p>
</div>

<div id="tela-erro" class="loading hidden">
  <p class="msg erro" id="erro-texto"></p>
</div>

<div id="tela-sucesso" class="sucesso-tela hidden">
  <h1>✅ Assinado com sucesso!</h1>
  <p class="subtitle">Obrigado, sua assinatura foi registrada.</p>
</div>

<div id="tela-form" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
  <h1>Assinatura Digital</h1>
  <p class="subtitle" id="subtitulo">SD Vidros</p>

  <div id="contrato-texto"></div>

  <label for="nome-input">Seu nome completo</label>
  <input type="text" id="nome-input" placeholder="Digite seu nome" autocomplete="name">

  <label>Assine no campo abaixo (use o dedo)</label>
  <canvas id="signature-pad"></canvas>
  <div class="canvas-actions">
    <button class="btn-limpar" id="btn-limpar">Limpar</button>
  </div>

  <button class="btn-confirmar" id="btn-confirmar" disabled>Confirmar Assinatura</button>
  <p class="msg erro hidden" id="form-erro"></p>
</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const contratoId = params.get('id');

  const telaLoading = document.getElementById('tela-loading');
  const telaErro = document.getElementById('tela-erro');
  const telaSucesso = document.getElementById('tela-sucesso');
  const telaForm = document.getElementById('tela-form');
  const erroTexto = document.getElementById('erro-texto');

  function mostrarErro(msg) {
    telaLoading.classList.add('hidden');
    telaForm.classList.add('hidden');
    erroTexto.textContent = msg;
    telaErro.classList.remove('hidden');
  }

  if (!contratoId) {
    mostrarErro('Link inválido: contrato não identificado.');
    return;
  }

  fetch('/api/contrato?id=' + encodeURIComponent(contratoId))
    .then(r => r.json().then(data => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
      if (!ok) throw new Error(data.error || 'Erro ao carregar contrato.');
      if (data.assinado) {
        telaLoading.classList.add('hidden');
        telaSucesso.classList.remove('hidden');
        telaSucesso.querySelector('.subtitle').textContent =
          'Este contrato já foi assinado por ' + (data.assinante_nome || '') + '.';
        return;
      }
      document.getElementById('contrato-texto').textContent = data.texto;
      document.getElementById('subtitulo').textContent =
        (data.cliente_nome ? data.cliente_nome + ' — ' : '') + (data.numero_os || '');
      telaLoading.classList.add('hidden');
      telaForm.classList.remove('hidden');
      iniciarCanvas();
    })
    .catch(err => mostrarErro(err.message || 'Erro ao carregar contrato.'));

  function iniciarCanvas() {
    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    const nomeInput = document.getElementById('nome-input');
    const btnConfirmar = document.getElementById('btn-confirmar');
    const btnLimpar = document.getElementById('btn-limpar');
    const formErro = document.getElementById('form-erro');

    let desenhando = false;
    let temTraco = false;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#111';
    }
    resize();

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }

    function start(e) {
      e.preventDefault();
      desenhando = true;
      temTraco = true;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      atualizarBotao();
    }
    function move(e) {
      if (!desenhando) return;
      e.preventDefault();
      const p = pos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    function end() { desenhando = false; }

    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);

    btnLimpar.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      temTraco = false;
      atualizarBotao();
    });

    function atualizarBotao() {
      btnConfirmar.disabled = !(temTraco && nomeInput.value.trim().length > 1);
    }
    nomeInput.addEventListener('input', atualizarBotao);

    btnConfirmar.addEventListener('click', () => {
      formErro.classList.add('hidden');
      btnConfirmar.disabled = true;
      btnConfirmar.textContent = 'Enviando...';

      const assinaturaBase64 = canvas.toDataURL('image/png');

      fetch('/api/assinar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: contratoId,
          assinante_nome: nomeInput.value.trim(),
          assinatura_base64: assinaturaBase64
        })
      })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
          if (!ok) throw new Error(data.error || 'Erro ao enviar assinatura.');
          telaForm.classList.add('hidden');
          telaSucesso.classList.remove('hidden');
        })
        .catch(err => {
          formErro.textContent = err.message || 'Erro ao enviar assinatura.';
          formErro.classList.remove('hidden');
          btnConfirmar.disabled = false;
          btnConfirmar.textContent = 'Confirmar Assinatura';
        });
    });
  }
})();
</script>
</body>
</html>
